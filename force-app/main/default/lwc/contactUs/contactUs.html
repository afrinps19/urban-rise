                Fill in the details and we'll be in touch shortly.
            </p>

            <hr />

            <div class="form-grid">

                <div>
                    <label>FULL NAME *</label>
                    <input
                        type="text"
                        name="name"
                        onchange={handleChange}
                        placeholder="Your full name"
                    />
                </div>

                <div>
                    <label>EMAIL ADDRESS *</label>
                    <input
                        type="email"
                        name="email"
                        onchange={handleChange}
                        placeholder="your@email.com"
                    />
                </div>

                <div>
                    <label>PHONE NUMBER</label>
                    <input
                        type="text"
                        name="phone"
                        onchange={handleChange}
                        placeholder="+91 XXXXX XXXXX"
                    />
                </div>

                <div>
                    <label>ENQUIRY TYPE</label>

                    <select
                        name="type"
                        onchange={handleChange}>

                        <option value="">
                            Select type
                        </option>

                        <option>
                            Property Purchase
                        </option>

                        <option>
                            Site Visit
                        </option>

                        <option>
                            Investment
                        </option>

                        <option>
                            General Enquiry
                        </option>

                    </select>

                </div>

                <div>
                    <label>PREFERRED LOCATION</label>

                    <input
                        type="text"
                        name="location"
                        onchange={handleChange}
                        placeholder="e.g. Mumbai, Bangalore, Kochi"
                    />
                </div>

                <div>
                    <label>MESSAGE</label>

                    <textarea
                        name="message"
                        rows="5"
                        onchange={handleChange}
                        placeholder="Tell us about your requirement">
                    </textarea>
                </div>

            </div>

            <button
                class="send-btn"
                onclick={handleSubmit}>

                ✦ SEND MESSAGE

            </button>
