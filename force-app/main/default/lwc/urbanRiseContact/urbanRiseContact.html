<template>

    <section class="contact-section">

        <div class="section-heading">
            <div class="line"></div>
            <span>◆ CONTACT INFORMATION ◆</span>
            <div class="line"></div>
        </div>

        <div class="contact-container">

            <div class="contact-info">

                <h2>Get in Touch</h2>

                <div class="info-item">
                    <div class="icon-box">☎</div>
                    <div>
                        <div class="label">PHONE</div>
                        <p>+91 98765 43210</p>
                        <p>+91 11 4567 8900</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="icon-box">✉</div>
                    <div>
                        <div class="label">EMAIL</div>
                        <p>support@urbanrise.com</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="icon-box">🏢</div>
                    <div>
                        <div class="label">HEAD OFFICE</div>
                        <p>Lulu Cyber Tower,5th Floor</p>
                        <p>MG Road, Kochi</p>
                        <p>Kerala, India – 280751</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="icon-box">🕒</div>
                    <div>
                        <div class="label">WORKING HOURS</div>
                        <p>Mon – Sat, 9:00 AM – 8:00 PM</p>
                    </div>
                </div>

            </div>

            <div class="enquiry-form">

                <h2>Request a Private Viewing</h2>

                <input
                    type="text"
                    placeholder="Your Full Name"
                    value={fullName}
                    onchange={handleName}
                />

                <input
                    type="tel"
                    placeholder="Phone Number"
                    value={phone}
                    onchange={handlePhone}
                />

                <input
                    type="email"
                    placeholder="Email Address"
                    value={email}
                    onchange={handleEmail}
                />

                <lightning-combobox
                    name="property"
                    placeholder="Select Property"
                    options={propertyOptions}
                    value={propertyId}
                    onchange={handleProperty}>
                </lightning-combobox>

                <button onclick={handleSubmit}>
                    REQUEST VIEWING
                </button>

            </div>

        </div>

    </section>

</template>
