<template>

    <div class="container">

        <h1>Featured Properties</h1>

        <div class="property-grid">

            <template
                for:each={properties}
                for:item="property">

                <div
                    key={property.Id}
                    class="property-card">

                    <div class="status">

                        {property.Status__c}

                    </div>

                    <div class="body">

                        <h2>
                            {property.Property_Name__c}
                        </h2>

                        <p>
                            📍 {property.Location__c}
                        </p>

                        <p>
                            Price :
                            ₹ {property.Price_Per_Unit__c}
                        </p>

                        <p>
                            Available Units :
                            {property.Available_Units__c}
                        </p>

                    </div>

                </div>

            </template>

        </div>

    </div>

</template>
